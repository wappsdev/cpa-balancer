[project]
name = "cpa-balancer"
version = "0.1.0"
description = "Quota-aware Claude account balancing for CLIProxyAPI"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
cpa-balancer = "cpa_balancer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
